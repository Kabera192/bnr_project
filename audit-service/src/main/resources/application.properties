spring.application.name=audit-service

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=audit-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=rw.bnr.api_gateway.dto

# Logging Configuration
logging.level.rw.bnr.audit_service=DEBUG
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=INFO

# Jackson Configuration (for LocalDateTime handling)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Log File Configuration
audit.log.directory=logs
audit.log.filename.prefix=audit-log
audit.log.rotation.hours=48